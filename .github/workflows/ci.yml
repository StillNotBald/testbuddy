name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Action versions are major tags (v4) that exist upstream; pin to full SHAs before relying on this in production.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run rtm:verify
      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start standalone build
        run: |
          PORT=3100 npm run start:standalone > standalone.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3100/api/health > /dev/null && exit 0
            sleep 1
          done
          cat standalone.log
          exit 1

      - name: Playwright e2e
        run: npm run e2e
        env:
          BASE_URL: http://127.0.0.1:3100

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
